services:
  api:
    image: auto-bot-api

  tunnel-gateway:
    image: auto-bot-api
    environment:
      API_ORIGIN: http://api:8080
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["uvicorn", "tunnel_gateway:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - api
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
